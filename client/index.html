<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f4" data-app-theme-color />
    <meta name="description" content="本机 Codex 移动工作台：在 iPhone 上接管桌面线程、追问运行任务、查看完整执行过程和接收完成通知。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CodexMobile" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" data-app-status-bar-style />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('codexmobile.theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[data-app-theme-color]')?.setAttribute('content', theme === 'dark' ? '#000000' : '#f7f7f4');
          document.querySelector('meta[data-app-status-bar-style]')?.setAttribute('content', theme === 'dark' ? 'black-translucent' : 'default');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/codex-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/codex-icon-180.png" />
    <title>CodexMobile</title>
    <style>
      #codexmobile-startup {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom));
        color: #f7f7f4;
        background: #0b0b0d;
        transition: opacity 160ms ease;
      }

      #codexmobile-startup.is-ready {
        opacity: 0;
        pointer-events: none;
      }

      .codexmobile-startup-content {
        display: grid;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }

      .codexmobile-startup-content img {
        width: 56px;
        height: 56px;
      }

      .codexmobile-startup-content strong {
        font: 650 22px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .codexmobile-startup-content span {
        color: #b8b8bc;
        font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="codexmobile-startup" role="status" aria-live="polite">
      <div class="codexmobile-startup-content">
        <img src="/codex-icon-180.png" alt="" aria-hidden="true" />
        <strong>CodexMobile</strong>
        <span>正在启动…</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
